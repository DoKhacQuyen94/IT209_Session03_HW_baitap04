<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
            color: #333;
        }
        .card {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 5px solid #059669;
        }
        h1 {
            color: #059669;
            margin-top: 0;
        }
        .badge {
            display: inline-block;
            background-color: #d1fae5;
            color: #065f46;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Port 8090</span>
        <h1>Welcome to Internal App</h1>
        <p>Đây là trang thông tin nội bộ (Internal Portal) đang chạy trên cổng <strong>8090</strong>.</p>
        <p>Được cấu hình bởi Nginx Virtual Host trên máy chủ ảo Droplet.</p>
    </div>
</body>
</html>
