<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
            color: #333;
        }
        .card {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 5px solid #2563eb;
        }
        h1 {
            color: #2563eb;
            margin-top: 0;
        }
        .badge {
            display: inline-block;
            background-color: #dbeafe;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Port 8080</span>
        <h1>Welcome to Beta Application</h1>
        <p>Đây là môi trường kiểm thử Beta App đang chạy trên cổng <strong>8080</strong>.</p>
        <p>Được cấu hình bởi Nginx Virtual Host trên máy chủ ảo Droplet.</p>
    </div>
</body>
</html>
